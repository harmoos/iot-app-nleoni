apiVersion: apps/v1
kind: Deployment
metadata:
  name: vloth2602/iot-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vloth2602/iot-app
  template:
    metadata:
      labels:
        app: vloth2602/iot-app
    spec:
      containers:
      - name: vloth2602/iot-app
        image: vloth2602/iot-app:v1
        ports:
        - containerPort: 8888